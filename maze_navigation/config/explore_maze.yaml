/**:
  ros__parameters:
    robot_base_frame: base_link
    return_to_init: true
    costmap_topic: map
    costmap_updates_topic: map_updates
    visualize: true
    planner_frequency: 0.15
    potential_scale: 10.0
    orientation_scale: 0.0
    gain_scale: 1.0
    transform_tolerance: 0.3
    min_frontier_size: 0.3

    # Frontier commitment (patches/m-explore-ros2/0002). The robot keeps the
    # frontier it chose until it is explored or reached, even if another one
    # scores better. It gives up early if Nav2 keeps failing or one of these runs out:
    progress_timeout: 20.0       # s without getting closer to the frontier
    commit_timeout: 60.0         # s in total without reaching it
    # A Nav2 failure can be brief (a late map->odom transform fails a goal at
    # once), so the same frontier is retried this many times before giving up.
    nav2_retries: 2
    nav2_retry_delay: 2.0        # s
    # A frontier it gave up on is postponed and tried again once no other
    # frontier is left; after this many tries it is abandoned for good.
    max_frontier_attempts: 3
    # A frontier that is still unexplored once the robot reaches it (or gives up
    # within exit_reach_distance of it) is open to the outside: a maze exit. The
    # robot never drives to it again. exit_settle_time lets the map catch up first.
    exit_reach_distance: 0.4     # m
    exit_settle_time: 4.0        # s
    # How close a frontier must be to a remembered one to count as the same.
    frontier_match_radius: 0.3   # m

    # Lidar exit detection (patches/m-explore-ros2/0004). A ray that hits nothing
    # within lidar range is left out of the SLAM map, so the space outside a
    # maze exit stays unexplored and a frontier remains in the opening. When the
    # lidar looks through most of a frontier and gets no return, nothing lies
    # behind it within range: it opens to the outside. Such a frontier becomes
    # an exit candidate, and an exit once seen that way from a second position.
    # Seeing walls behind a candidate makes it open again. Candidates are still
    # chosen in the usual order: the lidar is often fooled by an inner opening
    # that lines up with an exit, and putting candidates off made the robot
    # cross the maze back and forth.
    exit_detection: true
    scan_topic: scan
    exit_check_frequency: 2.0      # Hz; judges frontiers between plans
    exit_no_return_ratio: 0.75     # share of a frontier's points with no return
    exit_min_no_return_points: 5   # and at least this many of them
    exit_disprove_ratio: 0.25      # below this share (of the seen-through points) it is not an exit
    exit_confirm_views: 2          # positions it must be seen open from
    exit_view_separation: 0.3      # m between those positions
    # Within this distance (around walls) one look is enough: the rays through
    # the frontier fan out so widely that an inner opening would show walls.
    # A frontier 0.4 m away was seen open through an inner doorway lined up
    # with an exit, so keep this well below that.
    exit_confirm_distance: 0.25    # m
    # Gazebo reports infinity for "no return"; the TurtleBot3 LDS-01 driver
    # reports 0. Check what the real lidar reports (ros2 topic echo /scan,
    # pointing it at open space) and set this true if it is 0.
    lidar_short_is_no_return: false

    # Exit watch (patches/m-explore-ros2/0004). Once the robot is this near a
    # cell of the frontier it is heading for, with no wall between them in the
    # map, the lidar should map the space behind an inner frontier within a map
    # update or two (slam_maze.yaml map_update_interval: 2 s). If the unknown
    # area around the frontier does not shrink for exit_watch_time, nothing
    # there is coming into view: the frontier is a maze exit, and the robot
    # moves on to another frontier. Nav2 sometimes can't bring the robot closer
    # than about 0.55 m to an exit, so keep this above that.
    exit_watch_distance: 0.6       # m, straight line
    exit_watch_time: 6.0           # s; keep it a few map updates long
    exit_watch_radius: 0.5         # m around the frontier where unknown area is counted
    exit_watch_min_growth: 0.02    # m² the unknown area must shrink by to count as new area
