# slam_toolbox parameters for the small grid maze.
#
# Based on slam_toolbox's mapper_params_online_async.yaml. Changes from the
# defaults are marked "maze:". The stock settings only add a scan after the robot
# has driven about 0.5 m (turning in place does not count); in a ~1.5 m maze
# slam_toolbox then adds almost no scans, never corrects map->odom, and the pose
# is raw wheel odometry, whose heading drifts tens of degrees after wall contacts
# and in-place turns.
#
# Here the travel threshold is 0, so slam_toolbox adds a scan every
# minimum_time_interval seconds whether the robot is moving, turning or still.
# Every added scan is a node in the pose graph, so a shorter interval costs more
# CPU and memory over a long run.

slam_toolbox:
  ros__parameters:

    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS Parameters
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    use_map_saver: true
    mode: mapping

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 2.0          # maze: 5.0; refresh the map faster for exploration
    resolution: 0.05
    restamp_tf: false
    min_laser_range: 0.0
    max_laser_range: 3.5              # maze: 20.0; the TurtleBot3 LDS reaches 3.5 m
    minimum_time_interval: 1.0
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: true

    # General Parameters
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.0      # maze: 0.5; 0 = add scans on a timer (minimum_time_interval)
    minimum_travel_heading: 0.15      # maze: 0.5 (rad, about 9 deg); no effect while distance is 0
    check_min_dist_and_heading_precisely: false
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 3.5   # maze: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # Correlation Parameters - Correlation Parameters
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # Correlation Parameters - Loop Closure Parameters
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Scan Matcher Parameters
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0

    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    min_pass_through: 2
    occupancy_threshold: 0.1
