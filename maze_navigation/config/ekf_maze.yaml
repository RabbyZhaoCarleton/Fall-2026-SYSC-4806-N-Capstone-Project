# robot_localization EKF: publishes odom -> base_footprint.
#
# Wheel odometry gets the heading wrong whenever the wheels slip, mostly in quick
# turns in place. slam_toolbox starts every scan match from that heading and
# does not undo all of the error, so the map slowly rotates. The IMU's gyro
# measures turning directly and does not slip, so this filter takes forward
# speed from the wheels and turn rate from the gyro.
#
# On the real robot the TurtleBot3 driver must not publish its own
# odom -> base_footprint transform while this filter runs.

ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true              # the robot drives on a flat floor
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom             # this filter provides odom -> base_footprint

    # Wheel odometry: forward and sideways speed only (sideways is always 0 for a
    # differential drive, which keeps the estimate from drifting sideways).
    # Its turn rate and heading are left out: they are what slips.
    odom0: odom
    odom0_config: [false, false, false,    # x, y, z
                   false, false, false,    # roll, pitch, yaw
                   true,  true,  false,    # vx, vy, vz
                   false, false, false,    # vroll, vpitch, vyaw
                   false, false, false]    # ax, ay, az
    odom0_differential: false
    odom0_relative: false

    # IMU: turn rate only. Its absolute heading is not used, so the filter works
    # the same with a real IMU whose heading has no fixed reference.
    imu0: imu
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,      # vyaw
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true
