name: build

# Builds the workspace the same way setup.sh does, so a broken package.xml,
# CMakeLists.txt or launch file shows up on GitHub before anyone pulls it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    container: ros:jazzy
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          path: src/capstone

      - name: Import third-party repositories
        run: |
          apt-get update
          apt-get install -y python3-vcstool
          cd src && vcs import --input capstone/capstone.repos .

      # Same as setup.sh: our explore_lite changes (frontier commitment, exit
      # detection, ...) live in patches/<repo>/*.patch, not in the upstream repo.
      - name: Apply patches to third-party repositories
        run: |
          cd src
          for patch in capstone/patches/*/*.patch; do
            [ -e "$patch" ] || continue
            target="$(basename "$(dirname "$patch")")"
            echo "$target: applying $(basename "$patch")"
            git -C "$target" apply "$PWD/$patch"
          done

      - name: Install dependencies
        run: |
          rosdep update --rosdistro jazzy
          rosdep install --from-paths src --ignore-src -r -y

      - name: Build
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --packages-up-to maze_sim maze_description maze_navigation maze_bringup maze_experiments

      - name: Check that the simulation launch file loads
        run: |
          source install/setup.bash
          ros2 launch maze_sim maze.launch.py --show-args > /dev/null

      - name: Test the maze monitor
        run: |
          source install/setup.bash
          python3 -m pytest -q src/capstone/maze_monitor/test

      - name: Test the experiment suite
        run: |
          source install/setup.bash
          python3 -m pytest -q src/capstone/maze_experiments/test
